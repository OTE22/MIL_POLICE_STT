# Reverse proxy for the central server.
#
#   /api/  -> FastAPI backend
#   /      -> static Arabic RTL frontend
#
# Port 80  : plain HTTP (LAN / development)
# Port 443 : TLS (production). Place cert.pem + key.pem in central/nginx/certs
#            (see docs/security.md); self-signed certificates are generated by
#            scripts/generate_self_signed_cert.sh for LAN pilots.

upstream central_backend { server backend:8000; }
upstream central_frontend { server frontend:80; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Security headers shared by both servers (add_header does not inherit across
# blocks, so they are repeated through this include-like map approach).
server {
    listen 80;
    server_name _;

    # Uncomment in production to force TLS:
    # return 301 https://$host:8443$request_uri;

    include /etc/nginx/conf.d/locations.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/conf.d/locations.inc;
}
