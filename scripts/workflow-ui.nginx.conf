server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/workflow-tls/cert.pem;
    ssl_certificate_key /etc/nginx/workflow-tls/key.pem;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $workflow_backend http://workflow-ui-backend:8000;
    set $workflow_agent http://workflow-ui-agent:17117;
    location /api/ { proxy_pass $workflow_backend; }
    location /agent/ { rewrite ^/agent(/.*)$ $1 break; proxy_pass $workflow_agent; client_max_body_size 100m; proxy_read_timeout 120s; }
    location / { try_files $uri $uri/ /index.html; }
}
