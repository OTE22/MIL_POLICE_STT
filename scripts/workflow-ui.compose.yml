# Isolated real-API browser verification. Never point this service at the live database.
services:
  workflow-ui-backend:
    image: military-stt/central-backend:1.0.0
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:18000:8000"]
    volumes:
      - ./central/backend:/app:ro
      - ./storage/workflow-e2e/backend:/tmp/workflow-ui
    environment:
      CENTRAL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stt}:${POSTGRES_PASSWORD:-stt}@postgres:5432/${POSTGRES_DB:-military_stt}_workflow_ui_test
      CENTRAL_AUTH_MODE: local
      CENTRAL_ENVIRONMENT: development
      CENTRAL_JWT_SECRET: workflow-ui-test-only-secret-01234567890123456789
      CENTRAL_BOOTSTRAP_ADMIN_PASSWORD: AdminBootstrap!1
      CENTRAL_STORAGE_ROOT: /tmp/workflow-ui/storage
      CENTRAL_LOG_DIR: ""
      CENTRAL_PROCESSING_TOKEN_PRIVATE_KEY_PATH: /tmp/workflow-ui/priv.pem
      CENTRAL_PROCESSING_TOKEN_PUBLIC_KEY_PATH: /tmp/workflow-ui/pub.pem
    networks: [internal]
  workflow-ui-frontend:
    image: military-stt/central-frontend:1.0.0
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ./scripts/workflow-ui.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./central/frontend/dist:/usr/share/nginx/html:ro
    networks: [internal]
  workflow-ui-agent:
    image: military-stt/desktop-agent:1.0.0-cpu
    ports: ["127.0.0.1:17118:17117"]
    environment:
      AGENT_CENTRAL_URL: http://workflow-ui-backend:8000
      AGENT_CENTRAL_PUBLIC_KEY_AUTO_FETCH: "true"
      AGENT_CENTRAL_PUBLIC_KEY_PATH: /data/central_public_key.pem
      AGENT_ALLOWED_ORIGINS: http://localhost:18080,http://127.0.0.1:18080,http://workflow-ui-frontend
      AGENT_DEVICE_NAME: isolated-workflow-acceptance
      AGENT_DIARIZATION_MODEL: nvidia/Nemotron-3-Diarization
      AGENT_DIARIZATION_MODEL_REVISION: f667ed73aee57d40cc39428eb768b4fd87a0a29e
      AGENT_DIARIZATION_SPEAKER_CACHE_LEN: "264"
      AGENT_PRELOAD_MODELS: "false"
    volumes:
      - ./desktop-agent/app:/agent/app:ro
      - ./desktop-agent/models:/models:ro
      - ./storage/workflow-e2e/agent:/data
    depends_on:
      workflow-ui-backend:
        condition: service_healthy
    networks: [internal]
